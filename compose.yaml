services:
  scout:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    read_only: true

    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    restart: "no"


  api-football:
    extends:
      service: scout
    profiles: ["collectors"]
    command: ["python", "-m", "app.api_football_fixtures"]

  soccer-discovery:
    extends:
      service: scout
    profiles: ["collectors"]
    command: ["python", "-m", "app.soccer_football_info_discovery"]
    volumes:
      - ./data/cache/soccer_football_info:/app/data/cache/soccer_football_info
